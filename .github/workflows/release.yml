name: release

# Push a tag equal to the version in SKILL.md (for example v1.1.0) to publish
# literary-translator.zip, the file users of the Claude apps upload as a skill.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the tag matches SKILL.md
        run: |
          version=$(sed -n 's/^\*\*Version \([0-9.]*\)\.\*\*.*/\1/p' skills/literary-translator/SKILL.md)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but SKILL.md says version $version"
            exit 1
          fi
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
      - run: python -m pip install pytest
      - run: python -m pytest
      - run: python tools/build_zip.py
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/literary-translator.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
