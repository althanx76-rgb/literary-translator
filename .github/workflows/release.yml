name: release

# Publish a release on GitHub with a new tag equal to the version in SKILL.md (for example v1.1.0):
# this workflow runs the tests, builds literary-translator.zip (the file users of the Claude apps
# upload as a skill) and attaches it to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check that the tag matches SKILL.md
        run: |
          version=$(sed -n 's/^\*\*Version \([0-9.]*\)\.\*\*.*/\1/p' skills/literary-translator/SKILL.md)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but SKILL.md says version $version"
            exit 1
          fi
      - run: python -m pip install pytest
      - run: python -m pytest
      - run: python tools/build_zip.py
      - name: Attach the zip to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/literary-translator.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
