name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Official Python images, so that old versions keep working on new runners.
    # 3.9 is the python3 that ships with Apple's command line tools on many Macs.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install --quiet pytest
      - run: python -m pytest
